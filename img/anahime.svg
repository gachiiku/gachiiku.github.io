<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="アナ姫">
  <!-- アナ姫（GACHIIKUの穴予想キャラ）：ティアラと虫めがねで穴を探す、ちびのお姫様 -->
  <ellipse cx="60" cy="114" rx="32" ry="4" fill="#000" opacity=".12"/>

  <!-- うしろ髪（ふんわり長い髪・ラベンダー） -->
  <path d="M60 34c-20 0-30 14-30 30 0 18 2 32 6 40 7-1 12-6 14-14h20c2 8 7 13 14 14 4-8 6-22 6-40 0-16-10-30-30-30z" fill="#b79ce0"/>

  <!-- ドレス（ピンク） -->
  <path d="M42 86c-10 10-14 20-14 28h64c0-8-4-18-14-28z" fill="#ff9ec4"/>
  <path d="M28 114c6-4 12-4 16 0 4-4 12-4 16 0 4-4 12-4 16 0 4-4 10-4 16 0z" fill="#ffd2e4"/>
  <path d="M50 86l10 8 10-8" fill="#ffd2e4"/>
  <circle cx="60" cy="96" r="3" fill="#e8b923"/>

  <!-- 顔 -->
  <circle cx="60" cy="60" r="24" fill="#ffe2c6"/>

  <!-- 前髪 -->
  <path d="M36 58c0-16 10-26 24-26s24 10 24 26c-5-6-10-9-14-9-2 4-6 6-10 6s-8-2-10-6c-4 0-9 3-14 9z" fill="#b79ce0"/>
  <path d="M40 52c3-6 8-10 14-11M72 44c5 2 9 5 11 9" stroke="#d6c4f2" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- ティアラ（金に赤い宝石） -->
  <path d="M44 38l4-10 6 7 6-11 6 11 6-7 4 10z" fill="#ffd34d" stroke="#c99a12" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="60" cy="30" r="2.8" fill="#e23a5b"/>
  <circle cx="48" cy="32" r="1.6" fill="#5bc0eb"/><circle cx="72" cy="32" r="1.6" fill="#5bc0eb"/>

  <!-- 目（大きくきらきら・まつげ） -->
  <ellipse cx="51" cy="64" rx="4.2" ry="5.4" fill="#4a2a6b"/>
  <ellipse cx="69" cy="64" rx="4.2" ry="5.4" fill="#4a2a6b"/>
  <circle cx="52.5" cy="62" r="1.7" fill="#fff"/><circle cx="70.5" cy="62" r="1.7" fill="#fff"/>
  <circle cx="49.8" cy="66.5" r=".8" fill="#fff"/><circle cx="67.8" cy="66.5" r=".8" fill="#fff"/>
  <path d="M47 61l-3-1.5M73 61l3-1.5" stroke="#4a2a6b" stroke-width="1.6" stroke-linecap="round"/>

  <!-- ほっぺと口 -->
  <ellipse cx="44" cy="71" rx="4" ry="2.3" fill="#ff9eb3" opacity=".75"/>
  <ellipse cx="76" cy="71" rx="4" ry="2.3" fill="#ff9eb3" opacity=".75"/>
  <path d="M56 72q4 4 8 0" stroke="#c0485f" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 左手（口もと） -->
  <circle cx="40" cy="94" r="5" fill="#ffe2c6"/>

  <!-- 右手で虫めがね -->
  <path d="M100 90l7 10" stroke="#c99a12" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="95" cy="80" r="10" fill="#fff7fb" fill-opacity=".6" stroke="#ffd34d" stroke-width="4"/>
  <path d="M90 76q4-4 8-2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M76 92q10 0 22 2" stroke="#ff9ec4" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="101" cy="94" r="4.6" fill="#ffe2c6"/>

  <!-- きらっ -->
  <path d="M106 58l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffcf33"/>
  <path d="M18 70l1.4 3.4 3.4 1.4-3.4 1.4-1.4 3.4-1.4-3.4-3.4-1.4 3.4-1.4z" fill="#ff9ec4"/>
</svg>
