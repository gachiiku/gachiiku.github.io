# サイトを GitHub Pages に公開する。
#   ・データの取得は loop.yml（10分おき）が行い、取得のたびにこれを起動する
#   ・コードを push したときと、手動実行でも動く
name: データ更新と公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 選手データの鍵（過去データの最終日＋今日）
        id: key
        run: echo "key=racers-$(ls data/hist/*/*.json.gz | sort | tail -1 | xargs basename | cut -c1-8)-$(ls data/hist/*/* | wc -l | tr -d " ")-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 選手データを復元
        id: cache
        uses: actions/cache@v4
        with:
          path: data/racers
          key: ${{ steps.key.outputs.key }}

      - name: 選手データを作る（1日1回・成績データの集計）
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          command -v bsdtar || sudo apt-get install -y -qq libarchive-tools
          python -u scripts/fetch_racers.py
          python -u scripts/build_stats.py

      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p _site
          cp -r index.html players.html race.html admin.html css js data _site/
          rm -rf _site/data/hist
          rm -f _site/data/.fetch.lock

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
