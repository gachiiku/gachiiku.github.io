# 公式サイトからデータを取得し、GitHub Pages に公開する。
#   ・8:00〜23:59（日本時間）の間、10分おきに自動実行
#   ・コードを push したときと、手動実行（Actions 画面の Run workflow）でも動く
name: データ更新と公開

on:
  schedule:
    - cron: '*/10 23,0-14 * * *'   # UTC表記。日本時間 8:00〜23:59
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 取得したデータを main に保存する
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: データ取得（その日の初回は全件、以降は結果・直前情報だけ）
        if: github.event_name != 'push'
        run: python -u scripts/fetch_today.py

      - name: 過去のレース結果を追加（前日分）
        if: github.event_name != 'push'
        run: |
          Y=$(date -d yesterday +%Y); D=$(date -d yesterday +%Y%m%d)
          if [ -f "data/hist/$Y/$D.json.gz" ]; then echo '前日分は取得済み'; exit 0; fi
          command -v bsdtar || sudo apt-get install -y -qq libarchive-tools
          python -u scripts/fetch_history.py

      - name: 選手データの鍵（過去データの最終日＋今日）
        id: key
        run: echo "key=racers-$(ls data/hist/*/*.json.gz | sort | tail -1 | xargs basename | cut -c1-8)-$(ls data/hist/*/* | wc -l | tr -d " ")-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 選手データを復元
        id: cache
        uses: actions/cache@v4
        with:
          path: data/racers
          key: ${{ steps.key.outputs.key }}

      - name: 選手データを作る（1日1回・成績データの集計）
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          command -v bsdtar || sudo apt-get install -y -qq libarchive-tools
          python -u scripts/fetch_racers.py
          python -u scripts/build_stats.py

      - name: 取得したデータを保存
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo '変更なし'; exit 0; fi
          git commit -m "data: $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase -X theirs origin main
          git push

      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p _site
          cp -r index.html players.html race.html css js data _site/
          rm -rf _site/data/hist
          rm -f _site/data/.fetch.lock

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
