<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="ガチイク侍">
  <!-- ガチイク侍（GACHIIKUのマスコット）：三日月の前立ての兜をかぶった、ちびの侍 -->
  <ellipse cx="60" cy="114" rx="30" ry="4" fill="#000" opacity=".12"/>

  <!-- 体：紺の羽織に白い襟、腰に刀 -->
  <path d="M34 114c0-18 10-28 26-28s26 10 26 28z" fill="#1c2a5a"/>
  <path d="M52 87l8 13 8-13" fill="none" stroke="#f4f1ea" stroke-width="5" stroke-linejoin="round"/>
  <rect x="36" y="102" width="48" height="5" rx="2" fill="#c8322d"/>
  <path d="M70 104l26-10" stroke="#3a2a1a" stroke-width="4" stroke-linecap="round"/>
  <path d="M68 105l5-2" stroke="#e8b923" stroke-width="5" stroke-linecap="round"/>

  <!-- 顔 -->
  <circle cx="60" cy="60" r="26" fill="#ffd9b3"/>

  <!-- 兜（はち）と、左右のしころ -->
  <path d="M31 56c0-20 13-31 29-31s29 11 29 31z" fill="#1c2a5a"/>
  <path d="M31 52h58v7H31z" fill="#2b3d7a"/>
  <path d="M30 54c-5 3-8 9-8 14l11-4z M90 54c5 3 8 9 8 14l-11-4z" fill="#2b3d7a"/>
  <path d="M60 26v26M48 29l4 23M72 29l-4 23" stroke="#2b3d7a" stroke-width="1.6"/>

  <!-- 前立て（金の三日月）と、まんなかの赤い玉 -->
  <path d="M60 34c-12-2-22-12-24-26 6 9 14 14 24 14s18-5 24-14c-2 14-12 24-24 26z" fill="#e8b923" stroke="#b88a10" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="60" cy="36" r="4.5" fill="#c8322d" stroke="#8f1f1b" stroke-width="1"/>

  <!-- まゆ（気合い）と目 -->
  <path d="M43 64l11 3M77 64l-11 3" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="49" cy="71" rx="3.2" ry="3.8" fill="#222"/>
  <ellipse cx="71" cy="71" rx="3.2" ry="3.8" fill="#222"/>
  <circle cx="50.2" cy="69.6" r="1.1" fill="#fff"/>
  <circle cx="72.2" cy="69.6" r="1.1" fill="#fff"/>

  <!-- ほっぺと口 -->
  <ellipse cx="41" cy="77" rx="4" ry="2.4" fill="#ff9e8a" opacity=".7"/>
  <ellipse cx="79" cy="77" rx="4" ry="2.4" fill="#ff9e8a" opacity=".7"/>
  <path d="M55 79q5 4 10 0" stroke="#7a3b2e" stroke-width="2.2" fill="none" stroke-linecap="round"/>
</svg>
