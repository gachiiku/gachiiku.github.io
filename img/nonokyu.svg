<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="ののきゅ">
  <!-- ののきゅ（GACHIIKUの穴予想キャラ）：虫めがねで穴を探す、まるい水の妖精 -->
  <ellipse cx="60" cy="113" rx="30" ry="4" fill="#000" opacity=".12"/>

  <!-- しっぽ（ひれ） -->
  <path d="M34 96c-10-2-16 4-18 12 7-3 12-3 18-2z" fill="#6cc4d9"/>

  <!-- からだ（まるい） -->
  <ellipse cx="60" cy="72" rx="34" ry="36" fill="#8fd8e8"/>
  <ellipse cx="60" cy="84" rx="22" ry="20" fill="#e9fbff"/>

  <!-- 頭のしずく（あほ毛） -->
  <path d="M60 38c-5-8-3-16 3-20-1 7 4 12 2 20z" fill="#6cc4d9"/>

  <!-- 耳（小さなひれ） -->
  <path d="M30 52c-8-6-10-14-6-18 6 2 10 8 12 14z" fill="#6cc4d9"/>
  <path d="M90 52c8-6 10-14 6-18-6 2-10 8-12 14z" fill="#6cc4d9"/>

  <!-- 目（きらきら） -->
  <ellipse cx="48" cy="64" rx="6" ry="7.5" fill="#1d2b44"/>
  <ellipse cx="72" cy="64" rx="6" ry="7.5" fill="#1d2b44"/>
  <circle cx="50" cy="61" r="2.4" fill="#fff"/><circle cx="74" cy="61" r="2.4" fill="#fff"/>
  <circle cx="46.5" cy="67" r="1.1" fill="#fff"/><circle cx="70.5" cy="67" r="1.1" fill="#fff"/>

  <!-- ほっぺと口（ω） -->
  <ellipse cx="39" cy="74" rx="5" ry="3" fill="#ff8fb1" opacity=".75"/>
  <ellipse cx="81" cy="74" rx="5" ry="3" fill="#ff8fb1" opacity=".75"/>
  <path d="M54 74q3 4 6 0q3 4 6 0" stroke="#1d2b44" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 左手 -->
  <ellipse cx="29" cy="84" rx="6" ry="8" fill="#8fd8e8" transform="rotate(25 29 84)"/>

  <!-- 右手で虫めがね -->
  <path d="M101 87l9 12" stroke="#a0662c" stroke-width="5" stroke-linecap="round"/>
  <circle cx="96" cy="78" r="10" fill="#fffbe6" fill-opacity=".55" stroke="#e8b923" stroke-width="4"/>
  <path d="M91 74q4-4 8-2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M88 86q8-2 14 4" stroke="#8fd8e8" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="104" cy="92" r="5.5" fill="#8fd8e8"/>

  <!-- きらっ -->
  <path d="M108 54l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffcf33"/>
</svg>
