# サイトを GitHub Pages に公開する。
#   ・データの取得は loop.yml（10分おき）が行い、取得のたびにこれを起動する
#   ・コードを push したときと、手動実行でも動く
name: データ更新と公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 選手データを復元（racers.yml が作った一番新しいもの）
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/racers
            data/motors
          key: racers-latest
          restore-keys: racers-

      - name: 選手データがまだ無いときだけ作る
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          command -v bsdtar || sudo apt-get install -y -qq libarchive-tools
          python -u scripts/fetch_racers.py
          python -u scripts/build_stats.py
          python -u scripts/build_motors.py

      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p _site
          cp -r index.html players.html race.html admin.html css js data _site/
          rm -rf _site/data/hist
          rm -f _site/data/.fetch.lock

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
